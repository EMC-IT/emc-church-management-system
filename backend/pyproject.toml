[project]
name = "emc-church-backend"
version = "0.1.0"
description = "Production Backend API for EMC Church Management System"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "EMC IT Team", email = "it@emc.church" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "python-multipart>=0.0.19",
    "httpx>=0.28.0",
    "pwdlib[argon2]>=0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "celery-types>=0.22.0",
    "fastapi[standard]>=0.141.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "requires_db: test needs a reachable PostgreSQL instance",
    "requires_redis: test needs a reachable Redis instance",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "DTZ",  # guards against naive datetimes
    "T20",  # no print() in application code
    "SIM",
    "TID",
    "RUF",
    "ASYNC",
    "S",
]
ignore = [
    "B008",  # FastAPI dependency injection relies on function calls in defaults
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["directive"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # assert is the point of a test
    "S608",  # test SQL interpolates fixture-owned literal table names, not input
    "S105",  # password-hashing test fixtures use literal passwords, not credentials
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

# Editor-only. MyPy remains the type gate in CI; this exists so that Pylance /
# Pyright resolve imports against the project venv instead of a system
# interpreter, which otherwise reports every third-party import as missing.
[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["app", "tests", "migrations"]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.mypy]
python_version = "3.13"
files = ["app", "tests"]
exclude = ["^\\.venv/", "^migrations/versions/"]
plugins = ["pydantic.mypy"]

strict = true
warn_unreachable = true
show_error_codes = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["migrations.*"]
ignore_errors = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
