# Alembic configuration for the EMC CMS backend.
#
# The database URL is intentionally NOT set here. migrations/env.py reads it
# from application settings, so migrations and the running application can
# never disagree about which database they are pointed at, and no credential
# is committed to the repository.

[alembic]
script_location = migrations
version_locations = migrations/versions
prepend_sys_path = .

# Zero-padded sequential prefix keeps `ls versions/` in dependency order.
file_template = %%(rev)s_%%(slug)s

# Timestamps rendered inside migration files use UTC.
timezone = UTC

[post_write_hooks]
hooks = ruff_format, ruff_lint
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_lint.type = exec
ruff_lint.executable = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
